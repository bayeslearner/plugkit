format:
  html:
    # Light is first, so it is the default and the toggle starts bright.
    # Each bracket's .scss is compiled only for that theme, so the two colour
    # files never fight for specificity. Shared layout is in theme-neutral.css.
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css:
      - theme-neutral.css
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    mermaid:
      # `neutral` renders closest to the light palette before the CSS above
      # takes over, so a diagram is not dark-on-white for the first paint.
      theme: neutral
    filters:
      - present-mode

# ── API reference ─────────────────────────────────────────────────────────
# Generated by quartodoc from docstrings and signatures — the standard Quarto
# mechanism, so the reference is the same site, theme and search as the guide.
# Rebuild with `scripts/build-docs.sh` (or `quartodoc build --config docs/_quarto.yml`).
quartodoc:
  package: plugkit
  dir: reference
  title: "API reference"
  style: single-page
  out_index: index
  parser: google
  sections:
    - title: The kernel
      desc: |
        Contexts and fibers. `Context` is the lookup table a plugin is handed;
        `Fiber` is one mounted plugin and everything it registered.
      contents:
        - Context
        - Service
        - Fiber
        - FiberState
        - Inject
        - this_
    - title: Binding
      desc: |
        How a plain class becomes a service without importing the kernel.
      contents:
        - provide
        - plugin
        - bind
        - snake_case
        - CONTEXT_MEMBERS
    - title: Signals
      desc: |
        The standalone reactive library. Imports nothing from the kernel;
        `ReactiveService` is what binds it to fiber lifetime.
      contents:
        - Signal
        - Computed
        - Effect
        - batch
        - is_stale
    - title: Shipped services
      desc: |
        Ordinary plugins with no privileged status. Mount the ones you want.
      contents:
        - ConfigService
        - PointsService
        - Contribution
        - ReactiveService
        - SupervisorService
        - ToolsService
        - FileLoader
        - load_app
        - describe
        - format_tree
        - DIAGNOSTICS
        - timeout_policy
    - title: Tool pipeline
      desc: |
        The five-stage pipeline every tool call passes through.
      contents:
        - Tool
        - ToolExecution
        - ToolResult
        - Allow
        - Deny
        - Ask
        - Accept
        - Block
    - title: Errors
      contents:
        - CordisError
        - ValidationError
        - AggregateError
