format:
  html:
    # Light is first, so it is the default and the toggle starts bright.
    # Each bracket's .scss is compiled only for that theme, so the two colour
    # files never fight for specificity. Shared layout is in theme-neutral.css.
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    css:
      - theme-neutral.css
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    mermaid:
      # `neutral` renders closest to the light palette before the CSS above
      # takes over, so a diagram is not dark-on-white for the first paint.
      theme: neutral
    filters:
      - present-mode
