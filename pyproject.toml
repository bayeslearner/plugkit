[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bayeslearner-microkernel"
version = "0.1.0"
description = "A framework-agnostic, distribution-agnostic component kernel for agentic-era development"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

# Axis 1 (kernel/) has zero required dependencies.
# All dependencies below are for Axis 2 (providers/, adapters/, entries/).
dependencies = []

[project.optional-dependencies]
# Platform providers
providers = ["pyyaml>=6.0"]
# Transport adapters
rest = ["fastapi>=0.100", "uvicorn>=0.20"]
mcp = []  # MCP SDK — add when pinned
cli = ["click>=8.0"]
# Observability
tracing = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Example / development
dev = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "click>=8.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
# Everything
all = [
    "bayeslearner-microkernel[providers,rest,cli,tracing,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["kernel", "providers", "adapters", "entries"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
