[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plugkit"
version = "0.3.0"
description = "A plugin kernel for Python: every registration returns its undo, and a fiber owns it"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Kun Deng", email = "bayeslearner@gmail.com" }]
keywords = ["plugin", "microkernel", "dependency-injection", "cordis", "reactive", "signals", "ioc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# The kernel has zero required dependencies. Everything below is an extra
# for one of the shipped services, each of which degrades rather than fails.
dependencies = []

[project.urls]
Homepage = "https://github.com/bayeslearner/plugkit"
Documentation = "https://bayeslearner.github.io/plugkit/"
Repository = "https://github.com/bayeslearner/plugkit"
Issues = "https://github.com/bayeslearner/plugkit/issues"

# Every extra installs something the package actually imports. An extra with
# nothing behind it is worse than a missing one: it is a seam a consumer trusts
# and gets nothing from. `test_no_phantom_extras` is the guard.
[project.optional-dependencies]
# `ConfigService.load_yaml`, and the file-based composition loader
yaml = ["pyyaml>=6.0"]
# `ConfigService.load_env` / `load_pydantic` / `override`
config = ["dependency-injector>=4.41"]
# hot module replacement in the plugin loader
hmr = ["watchdog>=4.0"]

dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pyyaml>=6.0",
    "dependency-injector>=4.41",
    "watchdog>=4.0",
]
all = ["plugkit[yaml,config,hmr]"]

[tool.hatch.build.targets.wheel]
packages = ["src/plugkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
