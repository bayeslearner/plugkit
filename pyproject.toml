[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalpy-kernel"
version = "0.4.0"
description = "A Signal-based reactive component microkernel for Python backend services"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kun Deng", email = "bayeslearner@gmail.com" }]
keywords = ["microkernel", "reactive", "signals", "components", "dependency-injection", "ioc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Axis 1 (kernel/) has zero required dependencies.
# All dependencies below are for Axis 2 (providers/, adapters/, entries/).
dependencies = []

[project.urls]
Homepage = "https://github.com/bayeslearner/signalpy-kernel"
Documentation = "https://bayeslearner.github.io/signalpy-kernel/"
Repository = "https://github.com/bayeslearner/signalpy-kernel"
Issues = "https://github.com/bayeslearner/signalpy-kernel/issues"

[project.optional-dependencies]
# Platform providers
providers = ["pyyaml>=6.0"]
# Transport adapters
rest = ["fastapi>=0.100", "uvicorn>=0.20"]
mcp = []  # MCP SDK — add when pinned
cli = ["click>=8.0"]
# Observability
tracing = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]
# Example / development
dev = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "fastapi>=0.100",
    "click>=8.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",  # for FastAPI ASGI integration tests
]
# Everything
all = [
    "signalpy-kernel[providers,rest,cli,tracing,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/signalpy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
